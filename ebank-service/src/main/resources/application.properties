spring.application.name=ebank-service
server.port=8057
spring.datasource.url=jdbc:h2:mem:accounts-db
spring.h2.console.enabled=true
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

# Circuit breaker OpenFeign (Resilience4j) : active le fallback de CustomerRestClient
spring.cloud.openfeign.circuitbreaker.enabled=true
# délai max d'un appel avant fallback (1 s par défaut, trop court au premier appel)
resilience4j.timelimiter.configs.default.timeout-duration=5s


# Serveur MCP (Streamable HTTP, endpoint /mcp) utilisé par ebank-chatbot-service
spring.ai.mcp.server.name=ebank-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
