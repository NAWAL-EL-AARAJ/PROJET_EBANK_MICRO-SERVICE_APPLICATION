server:
  port: 8058

spring:
  application:
    name: ebank-chatbot-service
  cloud:
    discovery:
      enabled: true
    config:
      enabled: false
  ai:
    # Choix du LLM : "ollama" (local, par défaut) ou "openai" (API compatible OpenAI, ici Groq)
    # Exemple : $env:LLM_PROVIDER = "openai" avant de lancer l'application
    model:
      chat: ${LLM_PROVIDER:ollama}
      # on n'utilise que le chat : on désactive les autres modèles (embedding, image, audio...)
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    # 2 tentatives max vers le LLM : si Ollama est arrêté, /chat échoue vite au lieu de bloquer
    retry:
      max-attempts: 2
    # LLM en ligne Groq (gratuit, rapide) via l'API compatible OpenAI.
    # La clé est lue UNIQUEMENT depuis la variable d'environnement GROQ_API_KEY.
    openai:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        temperature: 0.2
        # Paramètre propre à Groq : ne pas renvoyer le raisonnement du modèle
        # (sinon Spring AI le renverrait à Groq à l'étape suivante, qui le refuse)
        extra-body:
          include_reasoning: false
    # LLM local servi par Ollama (lancer avant : ollama pull qwen3:8b)
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        temperature: 0.2
        # désactive le "raisonnement" (<think>...</think>) de qwen3 pour des réponses directes
        think: false
    # Client MCP : récupère les outils exposés par les deux microservices
    mcp:
      client:
        name: ebank-chatbot-mcp-client
        version: 1.0.0
        type: SYNC
        request-timeout: 60s
        streamable-http:
          connections:
            customer-service:
              url: http://localhost:8056
              endpoint: /mcp
            ebank-service:
              url: http://localhost:8057
              endpoint: /mcp

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Token du bot Telegram : lu UNIQUEMENT depuis la variable d'environnement TELEGRAM_BOT_TOKEN.
# Si elle est absente, le bot Telegram ne démarre pas (le endpoint /chat reste utilisable).
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
